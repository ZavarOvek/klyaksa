<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root {
  /* Layout: one narrow cartridge column. The scene sits on top, the choice under it, the arithmetic under the choice. */
  color-scheme: dark;
  --void: #15132b; --panel: #201d40; --panel-2: #2b2757; --line: #4a4487; --pit: #0b0a18;
  --ink: #efe9d6; --dim: #b3acd2; --gold: #f0bd4e;
  --good: #86dba6; --bad: #f58a78;
  --shield: #58b4ff; --health: #e85a5a; --armor: #f0c64a;
  --f-display: "Press Start 2P", "Courier New", monospace;
  --f-body: "Pixelify Sans", "Trebuchet MS", Verdana, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--void); color: var(--ink);
  background-image: radial-gradient(var(--panel) 1px, transparent 1px); background-size: 16px 16px;
  font: 17px/1.5 var(--f-body);
}
.wrap { max-width: 820px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 22px; }
p, h1, h2, h3, h4, ul, ol, dl, dd, pre { margin: 0; }
a { color: var(--gold); }
canvas { image-rendering: pixelated; }

/* Шапка */
.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between; }
.brand { display: flex; gap: 14px; align-items: center; min-width: 0; }
.brand .logo { width: 64px; height: 52px; flex: none; }
h1 { font: 400 clamp(15px, 4.2vw, 22px)/1.3 var(--f-display); color: var(--gold); text-shadow: 3px 3px 0 var(--pit); }
.tag { color: var(--dim); font-size: 15px; margin-top: 6px; max-width: 34ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 10px; }

/* Кнопки */
.btn, .tab, .pip {
  font: inherit; color: var(--ink); background: var(--panel-2); border: 3px solid var(--line);
  box-shadow: 0 4px 0 0 var(--pit); cursor: pointer; text-align: left; border-radius: 0;
}
.btn:active:not(:disabled), .tab:active, .pip:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 0 var(--pit); }
.btn:hover:not(:disabled), .tab:hover, .pip:hover:not(:disabled) { border-color: var(--gold); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.tab { padding: 8px 12px; font: 400 10px/1.4 var(--f-display); color: var(--dim); }

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <canvas class="face logo" width="16" height="13" data-mood="idle" aria-hidden="true"></canvas>
      <div><h1>Blot's School</h1><p class="tag">A trainer for Warframe damage math and status logic, on the rules since Jade Shadows</p></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Modes">
      <button type="button" class="tab" role="tab" data-view="run" id="tab-run">Run</button>
      <button type="button" class="tab" role="tab" data-view="arena" id="tab-arena">Arena</button>
      <button type="button" class="tab" role="tab" data-view="sandbox" id="tab-sandbox">Sandbox</button>
      <button type="button" class="tab" role="tab" data-view="sheet" id="tab-sheet">Cheat sheet</button>
    </nav>
  </header>
  <main id="view"></main>
  <footer class="foot"><p>Numbers checked against <a href="https://wiki.warframe.com/w/Damage">wiki.warframe.com</a> on 9 October 2026. The game also rounds damage (quantization), and this trainer does not. <a href="index.html">Українська версія</a></p></footer>
</div>
<script>
/* ---------- Рушій розрахунку. Правила після Update 36 (Jade Shadows). ---------- */
const FACTIONS = {
  none:     { name: 'Без фракції',     plus: [],                          minus: [] },
  grineer:  { name: 'Grineer',         plus: ['Impact', 'Corrosive'],     minus: [] },
  kuva:     { name: 'Kuva Grineer',    plus: ['Impact', 'Corrosive'],     minus: ['Heat'] },
  corpus:   { name: 'Corpus',          plus: ['Puncture', 'Magnetic'],    minus: [] },
  amalgam:  { name: 'Corpus Amalgam',  plus: ['Electricity', 'Magnetic'], minus: ['Blast'] },
  infested: { name: 'Infested',        plus: ['Slash', 'Heat'],           minus: [] },
  deimos:   { name: 'Infested Deimos', plus: ['Blast', 'Gas'],            minus: ['Viral'] },
  orokin:   { name: 'Orokin',          plus: ['Puncture', 'Viral'],       minus: ['Radiation'] },
  sentient: { name: 'Sentient',        plus: ['Cold', 'Radiation'],       minus: ['Corrosive'] },
  narmer:   { name: 'Narmer',          plus: ['Slash', 'Toxin'],          minus: ['Magnetic'] },
  murmur:   { name: 'The Murmur',      plus: ['Electricity', 'Radiation'],minus: ['Viral'] },
  zariman:  { name: 'Zariman',         plus: ['Void'],                    minus: [] },
  scaldra:  { name: 'Scaldra',         plus: ['Impact', 'Corrosive'],     minus: ['Gas'] },
  techrot:  { name: 'Techrot',         plus: ['Gas', 'Magnetic'],         minus: ['Cold'] },
  anarchs:  { name: 'Anarchs',         plus: ['Impact', 'Electricity'],   minus: ['Radiation'] },
};
const COMBO = {
  'Cold+Heat': 'Blast', 'Electricity+Toxin': 'Corrosive', 'Heat+Toxin': 'Gas',
  'Cold+Electricity': 'Magnetic', 'Electricity+Heat': 'Radiation', 'Cold+Toxin': 'Viral',
};
const PHYS = ['Impact', 'Puncture', 'Slash'];

function typeMod(fid, type) {
  const f = FACTIONS[fid];
  return f.plus.includes(type) ? 1.5 : f.minus.includes(type) ? 0.5 : 1;
}
function armorDR(a) {
  if (a <= 0) return 0;
  return a <= 2700 ? 0.9 * Math.sqrt(a / 2700) : a / (a + 300);
}
function corrosiveStrip(n) { return n > 0 ? Math.min(0.8, 0.26 + 0.06 * (n - 1)) : 0; }
function viralMult(n) { return n > 0 ? 1 + Math.min(3.25, 1 + 0.25 * (n - 1)) : 1; }

/* Стихії зливаються попарно в порядку слотів: 1+2, 3+4. Непарна лишається сама. */
function combine(elems) {
  const order = [], sum = {};
  for (const e of elems) {
    if (!(e.el in sum)) { order.push(e.el); sum[e.el] = 0; }
    sum[e.el] += e.v;
  }
  const out = [];
  for (let i = 0; i < order.length; i += 2) {
    const a = order[i], b = order[i + 1];
    if (b) out.push({ el: COMBO[[a, b].sort().join('+')], v: sum[a] + sum[b], from: [a, b] });
    else out.push({ el: a, v: sum[a] });
  }
  return out;
}

function build(weapon, mods) {
  let baseB = 0, fac = 0, ccFlat = 0, sd = 0;
  const scList = [], msList = [], ccList = [], cdList = [], baseList = [], phys = { Impact: 0, Puncture: 0, Slash: 0 }, elems = [], prim = {};
  for (const m of mods.flatMap(x => x.fx || [x])) {
    if (m.k === 'base') { baseB += m.v; baseList.push(m.v); }
    else if (m.k === 'faction') fac += m.v;
    else if (m.k === 'cc') ccList.push(m.v);
    else if (m.k === 'cd') cdList.push(m.v);
    else if (m.k === 'ccflat') ccFlat += m.v;
    else if (m.k === 'status') sd += m.v;
    else if (m.k === 'sc') scList.push(m.v);
    else if (m.k === 'ms') msList.push(m.v);
    else if (m.k === 'phys') phys[m.t] += m.v;
    else if (m.k === 'elem') { elems.push({ el: m.t, v: m.v }); prim[m.t] = (prim[m.t] || 0) + m.v; }
  }
  const modBase = weapon.base * (1 + baseB);
  const parts = [];
  for (const t of PHYS) {
    const s = weapon.ips[t] || 0;
    if (s > 0) parts.push({ t, share: s, bonus: phys[t], v: modBase * s * (1 + phys[t]) });
  }
  const comb = combine(elems);
  for (const c of comb) parts.push({ t: c.el, pct: c.v, from: c.from, v: modBase * c.v });
  /* Крит: шанс = база × (1 + Σ моди) + плоскі бонуси; множник = база × (1 + Σ моди); у середньому 1 + шанс × (множник − 1). */
  const sum = a => a.reduce((x, y) => x + y, 0);
  const cc = (weapon.cc || 0) * (1 + sum(ccList)) + ccFlat, cm = (weapon.cm || 1) * (1 + sum(cdList));
  const crit = 1 + cc * (cm - 1);
  /* Шанс статусу і мультишот: база × (1 + Σ моди). Тип прока вибирається за часткою шкоди. */
  const sc = (weapon.sc || 0) * (1 + sum(scList)), ms = (weapon.ms || 1) * (1 + sum(msList));
  const total = parts.reduce((a, p) => a + p.v, 0);
  const share = t => parts.filter(p => p.t === t).reduce((a, p) => a + p.v, 0) / total;
  return { sc, ms, scList, msList, total, share, weapon, modBase, baseB, baseList, fac, parts, comb, prim, cc, cm, crit, ccList, cdList, ccFlat, sd, has: t => comb.some(c => c.el === t) };
}

function effArmor(tg) {
  const st = tg.st || {};
  return (tg.armor || 0) * (1 - corrosiveStrip(st.corrosive || 0)) * (st.heat ? 0.5 : 1);
}
function hit(b, tg) {
  const st = tg.st || {};
  const dr = armorDR(effArmor(tg)), vm = viralMult(st.viral || 0);
  let raw = 0; const lines = [];
  for (const p of b.parts) {
    const tm = typeMod(tg.faction, p.t), d = p.v * (1 + b.fac) * tm;
    raw += d; lines.push({ ...p, tm, d });
  }
  return { raw, dr, vm, lines, armor: effArmor(tg), health: raw * (1 - dr) * vm * b.crit };
}
/* DoT. Фракційний бонус входить двічі: у модовану базу і ще раз у тік. */
function bleedTick(b, tg) {
  return 0.35 * b.modBase * (1 + b.fac) ** 2 * (1 + b.sd) * viralMult((tg.st || {}).viral || 0);
}
function heatTick(b, tg) {
  if (!b.has('Heat')) return 0;
  return 0.5 * b.modBase * (1 + (b.prim.Heat || 0)) * (1 + b.fac) ** 2 * (1 + b.sd)
    * typeMod(tg.faction, 'Heat') * (1 - armorDR(effArmor(tg))) * viralMult((tg.st || {}).viral || 0);
}
function blastPop(b, tg) {
  if (!b.has('Blast')) return 0;
  return 0.3 * b.modBase * (1 + b.fac) ** 2 * (1 + b.sd)
    * typeMod(tg.faction, 'Blast') * (1 - armorDR(effArmor(tg))) * viralMult((tg.st || {}).viral || 0);
}
/* Тік або вибух статусу будь-якого типу. Toxin та Electricity множаться своїми модами, Gas і Blast модами половинок не множаться. */
function dotTick(b, tg, t) {
  if (t === 'Slash') return bleedTick(b, tg);
  const def = typeMod(tg.faction, t) * (1 - armorDR(effArmor(tg))) * viralMult((tg.st || {}).viral || 0);
  const f = (1 + b.fac) ** 2 * (1 + b.sd);
  if (['Heat', 'Toxin', 'Electricity'].includes(t)) return 0.5 * b.modBase * (1 + (b.prim[t] || 0)) * f * def;
  if (t === 'Gas') return 0.5 * b.modBase * f * def;
  if (t === 'Blast') return 0.3 * b.modBase * f * def;
  return null;
}
/* Скільки пострілів до смерті цілі зі щитом. Toxin іде одразу в здоров'я. */
function shotsToKill(b, tg, carry = true) {
  const h = hit(b, tg);
  let sh = tg.shields, hp = tg.health, shots = 0, broke = 0;
  const tox = h.lines.filter(l => l.t === 'Toxin').reduce((a, l) => a + l.d, 0);
  const rest = h.raw - tox;
  while (hp > 0 && shots < 99) {
    shots++;
    hp -= tox;
    if (sh > 0) {
      sh -= rest;
      if (sh <= 0) { broke = shots; if (carry) hp += sh; sh = 0; }
    } else hp -= rest;
  }
  return { shots, broke, tox, rest, shieldLeft: Math.max(0, sh) };
}
/* Додатковий хіт (Toxic Lash, Resupply тощо): відсоток від усього пострілу, ще раз × фракційний бонус.
   Його тік рахується від самого хіта: × 0.5 × (1 + моди тієї ж стихії) × (1 + фракційний бонус). */
function weaponHitRaw(b) { return b.parts.reduce((a, p) => a + p.v, 0) * (1 + b.fac); }
function extraHit(b, tg, pct, type) {
  const st = tg.st || {}, def = typeMod(tg.faction, type) * (1 - armorDR(effArmor(tg))) * viralMult(st.viral || 0);
  const src = weaponHitRaw(b), raw = src * pct * (1 + b.fac), bonus = b.prim[type] || 0;
  return { src, raw, bonus, dealt: raw * def, tick: 0.5 * raw * (1 + bonus) * (1 + b.fac) * (1 + b.sd) * def };
}

const f1 = x => {
  const r = Math.round(x * 10) / 10;
  const s = r % 1 ? r.toFixed(1) : String(r);
  return Math.abs(r) >= 10000 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : s;
};
const pct = x => (Math.round(x * 1000) / 10) + '%';
const x2 = x => String(Math.round(x * 100) / 100);
const x3 = x => String(Math.round(x * 1000) / 1000);

function rowsHit(b, h, tg) {
  const R = T.r, rows = [];
  rows.push([R.base(f1(b.weapon.base), b.baseList.join(' + ')), f1(b.modBase)]);
  for (const l of h.lines) {
    let lab;
    if (PHYS.includes(l.t)) {
      lab = `${l.t}: ${l.share === 1 ? R.all : R.share(Math.round(l.share * 100))}`;
      if (l.bonus) lab += ` × (1 + ${l.bonus})`;
    } else {
      lab = `${l.t}${l.from ? ' (' + l.from.join(' + ') + ')' : ''}: ${f1(b.modBase)} × ${x2(l.pct)}`;
    }
    rows.push([lab, f1(l.v)]);
  }

        <p class="narr">${S.orderNote}</p>
        <h3 class="ask">${S.hCrit}</h3>
        <div class="tbl"><pre class="formula">${S.critFormula}</pre></div>
        <p class="narr">${S.critNote}</p>
        <h3 class="ask">${S.hProc}</h3>
        <div class="tbl"><pre class="formula">${S.procFormula}</pre></div>
        <p class="narr">${S.procNote}</p>
        <h3 class="ask">${S.hExtra}</h3>
        <p class="narr">${S.extraIntro}</p>
        <div class="tbl"><pre class="formula">${S.extraFormula}</pre></div>
        <p class="narr">${S.extraNote}</p>
        <div class="tbl"><table class="fx xh"><thead><tr><th>${S.thSource}</th><th>${S.thHit}</th><th>${S.thNote}</th></tr></thead><tbody>
          ${S.extra.map(([a, b, c]) => `<tr><td>${a}</td><td>${b}</td><td>${c}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="narr small">${S.extraFoot}</p>
        <h3 class="ask">${S.hDef}</h3>
        <div class="tbl"><pre class="formula">${S.defFormula}</pre></div>
        <p class="narr">${S.defNote}</p>
        <h3 class="ask">${S.hAb}</h3>
        <div class="tbl"><pre class="formula">${S.abFormula}</pre></div>
        <p class="narr">${S.abNote}</p>
        <h3 class="ask">${S.hCombos}</h3>
        <ul class="combos">${combos.map(([a, b, c]) => `<li>${ty(a)} + ${ty(b)} = ${ty(c)}</li>`).join('')}</ul>
        <p class="narr">${S.comboNote}</p>
        <h3 class="ask">${S.hStatus}</h3>
        <dl class="status">${S.status.map(([t, d]) => `<div><dt>${ty(t)}</dt><dd>${d}</dd></div>`).join('')}</dl>
      </section>`;
  }

  /* ---------- Пісочниця: вигадані моди, чесні купи ---------- */
  const SLOTS = 8;
  const SBM = {
    base:  { pile: 'base', k: 'base', v: 1.65, like: 'Serration' },
    heat:  { pile: 'elem', k: 'elem', t: 'Heat', v: 0.9, like: 'Hellfire' },
    cold:  { pile: 'elem', k: 'elem', t: 'Cold', v: 0.9, like: 'Cryo Rounds' },
    elec:  { pile: 'elem', k: 'elem', t: 'Electricity', v: 0.9, like: 'Stormbringer' },
    tox:   { pile: 'elem', k: 'elem', t: 'Toxin', v: 0.9, like: 'Infected Clip' },
    imp:   { pile: 'elem', k: 'phys', t: 'Impact', v: 1.2 },
    pun:   { pile: 'elem', k: 'phys', t: 'Puncture', v: 1.2 },
    sla:   { pile: 'elem', k: 'phys', t: 'Slash', v: 1.2, like: 'Fanged Fusillade' },
    fac30: { pile: 'fac', k: 'faction', v: 0.3, like: 'Bane' },
    fac55: { pile: 'fac', k: 'faction', v: 0.55, like: 'Primed Bane' },
    cc:    { pile: 'crit', k: 'cc', v: 1.5, like: 'Point Strike' },
    cd:    { pile: 'crit', k: 'cd', v: 1.2, like: 'Vital Sense' },
    ms:    { pile: 'ms', k: 'ms', v: 0.9, like: 'Split Chamber' },
    sc:    { pile: 'st', k: 'sc', v: 0.9 },
    sd:    { pile: 'st', k: 'status', v: 0.9, like: 'Rifle Elementalist' },
  };
  const SBO = Object.keys(SBM), PILES = ['base', 'elem', 'fac', 'crit', 'ms', 'st'];
  const SBW = [
    { base: 100, ips: { Impact: 0.34, Puncture: 0.33, Slash: 0.33 }, cc: 0.2, cm: 2, sc: 0.2, ms: 1 },
    { base: 100, ips: { Impact: 0.1, Puncture: 0.7, Slash: 0.2 }, cc: 0.35, cm: 3, sc: 0.1, ms: 1 },
    { base: 100, ips: { Impact: 0.1, Puncture: 0.2, Slash: 0.7 }, cc: 0.1, cm: 2, sc: 0.35, ms: 1 },
  ];
  const ARMORS = [0, 300, 1200, 2700];
  const sbName = id => T.sb.mod[id];
  const pl = p => `<span class="pl" data-p="${p}"></span>`;

  function sbCalc(s, mods) {
    const none = s.fac === 'none';
    const list = (mods || s.mods).map(id => (none && SBM[id].k === 'faction' ? { k: 'none' } : SBM[id]));
    const b = build(SBW[s.w], list);
    const tg = { faction: s.fac, armor: s.armor, st: { viral: s.viral ? 10 : 0, corrosive: s.cor ? 10 : 0 } };
    const h = hit(b, tg);
    return { b, tg, h, shot: h.health * b.ms };
  }
  function sbRemarks(s, c) {
    const S = T.sb.say, b = c.b, f = FACTIONS[s.fac], none = s.fac === 'none', out = [];
    if (!s.mods.length) return [{ t: S.empty, mood: 'idle' }];
    const has = k => s.mods.some(id => SBM[id].k === k);
    const direct = id => !['sc', 'status'].includes(SBM[id].k) && !(none && SBM[id].k === 'faction');
    if (none && has('faction')) out.push({ t: S.noFaction, mood: 'sad' });
    const res = c.h.lines.filter(l => l.tm < 1 && l.v / b.total >= 0.15).sort((x, y) => y.v - x.v)[0];
    if (res) out.push({ t: S.resist(res.t, f.name, pct(res.v / b.total)), mood: 'sad' });
    /* Найслабший слот: що буде без нього і що буде, якщо поставити на його місце найкращу заміну. */
    let weak = null;
    s.mods.forEach((id, i) => {
      if (!direct(id)) return;
      const without = sbCalc(s, s.mods.filter((_, k) => k !== i)).shot, gain = c.shot / without;
      if (!weak || gain < weak.gain) weak = { i, id, gain, without };
    });
    if (weak && weak.gain < 0.995) out.push({ t: S.hurts(sbName(weak.id), x2(weak.gain)), mood: 'sad' });
    else if (weak) {
      let best = null;
      for (const id of SBO) {
        if (id === weak.id || !direct(id)) continue;
        const shot = sbCalc(s, s.mods.map((x, k) => (k === weak.i ? id : x))).shot;
        if (!best || shot > best.shot) best = { id, shot };
      }
      if (best && best.shot / c.shot >= 1.1) {
        const p = SBM[weak.id].pile, n = s.mods.filter(id => SBM[id].pile === p).length;
        const a = [sbName(weak.id), x2(weak.gain), sbName(best.id), x2(best.shot / weak.without)];
        const stacked = n > 1 && p !== 'crit' && !(p === 'elem' && c.h.lines.some(l => l.tm < 1));
        out.push({ t: stacked ? S.swapPile(...a, T.sb.piles[p], n) : S.swap(...a), mood: 'idle' });
      }
    }
    if (has('cd') && !has('cc') && b.cc < 0.3) out.push({ t: S.critNoChance(pct(b.cc)), mood: 'idle' });
    const dots = ['Slash', 'Heat', 'Toxin', 'Electricity', 'Gas', 'Blast'];
    const dotShare = b.parts.filter(p => dots.includes(p.t)).reduce((a, p) => a + p.v, 0) / b.total;
    if (has('status') && dotShare * b.sc * b.ms < 0.05) out.push({ t: S.sdNoDot, mood: 'idle' });
    const can = f.plus.filter(t => t !== 'Void');
    if (!none && can.length && !c.h.lines.some(l => l.tm > 1)) out.push({ t: S.unused(f.name, can.join(', ')), mood: 'idle' });
    if (c.h.dr >= 0.5 && !s.cor) out.push({ t: S.armor(pct(c.h.dr)), mood: 'idle' });
    if (!out.length) return [weak ? { t: s.mods.length < SLOTS ? S.goodMore : S.good, mood: 'happy' } : { t: S.statusOnly, mood: 'idle' }];
    return out.slice(0, 2);
  }
  function sbPiles(s, c) {
    const R = T.sb.rows, b = c.b, h = c.h, sum = a => a.reduce((x, y) => x + y, 0);
    const plus = a => ['1'].concat(a).join(' + ');
    const elemTerms = b.comb.map(e => x2(e.v)).concat(b.parts.filter(p => p.share && p.bonus).map(p => `${x2(p.share)} × ${x2(p.bonus)}`));
    const facList = s.fac === 'none' ? [] : s.mods.filter(id => SBM[id].k === 'faction').map(id => x2(SBM[id].v));
    const weak = h.raw / (b.total * (1 + b.fac));
    const typed = h.lines.filter(l => l.tm !== 1).map(l => `${l.t} ×${l.tm}`);
    const rows = [
      ['base', R.base, plus(b.baseList.map(x2)), 1 + b.baseB],
      ['elem', R.elem, plus(elemTerms), b.total / b.modBase],
      ['fac', R.fac, plus(facList), 1 + b.fac],
      ['', R.weak, typed.length ? typed.join(', ') : R.noWeak, weak],
      ['', R.armor(f1(h.armor)), h.dr ? `1 − ${pct(h.dr)}` : R.noArmor, 1 - h.dr],
      ['', R.viral, h.vm > 1 ? R.viralOn : R.viralOff, h.vm],
      ['crit', R.crit, `1 + ${x3(b.cc)} × (${x2(b.cm)} − 1)`, b.crit],
      ['ms', R.ms, plus(b.msList.map(x2)), b.ms],
    ];
    return `<div class="tbl"><table class="how piles"><tbody>
      <tr><td>${R.start}</td><td>${f1(b.weapon.base)}</td></tr>
      ${rows.map(([p, lab, f, m]) => `<tr class="${Math.abs(m - 1) < 1e-9 ? 'off' : ''}"><td>${p ? pl(p) : ''}<b>${lab}</b><span class="f">${f}</span></td><td>×${x2(m)}</td></tr>`).join('')}
      <tr class="total"><td>${T.sb.shot}</td><td>${f1(c.shot)}</td></tr></tbody></table></div>`;
  }
  function sbParts(c) {
    const S = T.sb, b = c.b;
    return `<ul class="parts">${c.h.lines.map(l => {
      const share = l.v / b.total, procs = b.ms * b.sc * share * 100, tick = dotTick(b, c.tg, l.t);
      const tm = l.tm > 1 ? '<span class="tm up">×1.5</span>' : l.tm < 1 ? '<span class="tm down">×0.5</span>' : '';
      return `<li class="part"><div class="p-h">${ty(l.t)}<span>${S.share(pct(share))}</span>${tm}</div>
        <div class="p-s">${S.procs(f1(procs))} · ${tick === null ? S.fx[l.t] : S.tick(f1(tick))}</div></li>`;
    }).join('')}</ul>`;
  }
  function paintSandbox(animated) {
    const S = T.sb, s = state.sb, c = sbCalc(s);
    const bare = sbCalc(s, []).shot, rem = sbRemarks(s, c), full = s.mods.length >= SLOTS;
    $('#sb-sum').innerHTML = `<div><p class="lab">${S.shot}</p><p class="big">${f1(c.shot)}</p></div><div class="sum-r"><p class="mult">${S.vsBare(x2(c.shot / bare))}</p><button type="button" class="link" id="sb-why">${rem[0].mood === 'happy' ? S.whyGood : S.why(rem.length)}</button></div>`;
    $('#sb-count').textContent = S.hSlots(s.mods.length, SLOTS);
    $('#sb-slots').innerHTML = Array.from({ length: SLOTS }, (_, i) => {
      const id = s.mods[i];
      return id ? `<li><button type="button" class="btn slot" data-sb-rm="${i}" aria-label="${S.remove(sbName(id))}">${pl(SBM[id].pile)}<span>${sbName(id)}</span><span class="x" aria-hidden="true">×</span></button></li>`
        : `<li class="slot empty"><span>${i + 1}</span></li>`;
    }).join('');
    document.querySelectorAll('[data-sb-add]').forEach(b => { b.disabled = full; });
    document.querySelectorAll('[data-sb-w]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.sbW === s.w));
    $('#sb-wdesc').textContent = S.weapons[s.w][1];
    $('#sb-out').innerHTML = `
      ${rem.map(r => `<div class="say"><canvas class="face" width="16" height="13" data-mood="${r.mood}" aria-hidden="true"></canvas><p>${r.t}</p></div>`).join('')}
      <h4 class="lab">${S.hPiles}</h4>${sbPiles(s, c)}
      <h4 class="lab">${S.hParts}</h4>${sbParts(c)}
      <p class="narr small">${S.partsNote}</p>`;
    const look = LOOK[s.fac] || ['dummy', 'dummy', 'sim'];
    setScene({ sprite: look[0], pal: look[1], scene: look[2], mood: rem[0].mood });
    faces();
    if (animated) {
      sc.hitAt = performance.now();
      const d = $('#dmg');
      d.textContent = `−${f1(c.shot)}`;
      d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop');
    }
    if (reduce) draw(1);
  }
  function renderSandbox() {
    const S = T.sb, s = state.sb, opt = (v, t, cur) => `<option value="${v}"${v === cur ? ' selected' : ''}>${t}</option>`;
    view.innerHTML = `
      <section class="run sandbox">
        <header class="room-head"><p class="eyebrow">${S.eyebrow}</p><h2>${S.title}</h2></header>
        <p class="narr">${S.intro}</p>
        <div class="stage"><canvas id="scene" width="200" height="84" role="img" aria-label="${S.alt}"></canvas><div class="dmg" id="dmg" aria-hidden="true"></div></div>
        <div class="sb-sum" id="sb-sum" aria-live="polite"></div>
        <fieldset><legend class="lab">${S.hWeapon}</legend>
          <div class="seg">${S.weapons.map(([n], i) => `<button type="button" class="btn" data-sb-w="${i}">${n}</button>`).join('')}</div>
          <p class="w-desc" id="sb-wdesc"></p>
        </fieldset>
        <fieldset><legend class="lab">${S.hEnemy}</legend>
          <div class="fields">
            <label>${S.faction}<select id="sb-fac">${opt('none', S.dummy, s.fac)}${Object.keys(LOOK).map(k => opt(k, FACTIONS[k].name, s.fac)).join('')}</select></label>
            <label>${S.armor}<select id="sb-armor">${ARMORS.map(a => opt(a, a ? a : S.noArmor, s.armor)).join('')}</select></label>
            <label class="chk"><input type="checkbox" id="sb-viral"${s.viral ? ' checked' : ''}>${S.viral}</label>
            <label class="chk"><input type="checkbox" id="sb-cor"${s.cor ? ' checked' : ''}>${S.corrosive}</label>
          </div>
        </fieldset>
        <div class="sb-head"><h3 class="lab" id="sb-count"></h3><button type="button" class="btn small" id="sb-clear">${S.clear}</button></div>
        <ol class="slots" id="sb-slots"></ol>
        <div class="palette">${PILES.map(p => `<div class="pal-g"><h3 class="lab">${pl(p)}${S.piles[p]}</h3><div class="pal">${
          SBO.filter(id => SBM[id].pile === p).map(id => `<button type="button" class="btn" data-sb-add="${id}"><span class="o-t">${sbName(id)}</span><span class="o-s">${SBM[id].like ? S.like(SBM[id].like) : S.theory}</span></button>`).join('')}</div></div>`).join('')}</div>
        <div class="result" id="sb-out"></div>
      </section>`;
    paintSandbox(false);
  }
  function sbAct(fn) { fn(state.sb); save(); paintSandbox(true); }
  document.addEventListener('change', ev => {
    const t = ev.target, s = state.sb;
    if (t.id === 'sb-fac') sbAct(() => { s.fac = t.value; });
    else if (t.id === 'sb-armor') sbAct(() => { s.armor = +t.value; });
    else if (t.id === 'sb-viral') sbAct(() => { s.viral = t.checked; });
    else if (t.id === 'sb-cor') sbAct(() => { s.cor = t.checked; });
  });

  /* ---------- Каркас ---------- */
  function render() {
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.view === state.view));
    if (state.view === 'arena') renderArena();
    else if (state.view === 'sheet') renderSheet();
    else if (state.view === 'sandbox') renderSandbox();
    else renderRun();
    faces();
  }
  document.addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.classList.contains('tab')) { state.view = b.dataset.view; render(); }
    else if (b.classList.contains('pip')) goRoom(+b.dataset.room);
    else if (b.id === 'next') goRoom(state.room + 1);
    else if (b.id === 'again') { state.tried = {}; state.first = {}; state.last = {}; state.reached = 0; goRoom(0); }
    else if (b.id === 'toArena') { state.view = 'arena'; render(); window.scrollTo({ top: 0 }); }
    else if (b.id === 'nextQ') { newQ(); renderArena(); }
    else if (b.dataset.sbAdd) { if (state.sb.mods.length < SLOTS) sbAct(s => { s.mods.push(b.dataset.sbAdd); }); }
    else if (b.dataset.sbRm !== undefined) {
      const i = +b.dataset.sbRm;
      sbAct(s => { s.mods.splice(i, 1); });
      const left = document.querySelectorAll('#sb-slots button');
      (left[Math.min(i, left.length - 1)] || $('[data-sb-add]')).focus();
    }
    else if (b.dataset.sbW !== undefined) sbAct(s => { s.w = +b.dataset.sbW; });
    else if (b.id === 'sb-clear') sbAct(s => { s.mods = []; });
    else if (b.id === 'sb-why') $('#sb-out').scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
    else if (b.dataset.i !== undefined && b.closest('#opts')) pick(+b.dataset.i);
    else if (b.dataset.t && b.closest('.arena')) answer(b.dataset.t);
  });

  const start = d => {
    load();
    if (d && d.state) Object.assign(state, d.state);
    const h = (location.hash || '').replace('#', '');
    if (['arena', 'sheet', 'sandbox'].includes(h)) state.view = h;
    render();
    if (!reduce) requestAnimationFrame(loop);
  };
  start({});
})();
</script>
</body>
</html>
