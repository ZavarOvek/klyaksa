name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Explicit bash = -eo pipefail, so a crash in check.js is not hidden by `| tee`.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Built pages are in sync with src/
        run: |
          python3 build.py
          git diff --exit-code -- index.html en.html
      - name: Control values and rooms (check.js)
        run: |
          node check.js | tee check.out
          ! grep -q '!!' check.out
